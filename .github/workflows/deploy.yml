name: deploy

# Publishes site/ to GitHub Pages. index.html is generated here rather than
# committed, so that adding a place is a one-file change and a contributor's
# pull request can never fail on a build artefact they did not regenerate.
#
# Needs Settings -> Pages -> Source set to "GitHub Actions" once, by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the one dependency
        run: python -m pip install --quiet -r requirements.txt

      - name: Refuse to publish a corpus that does not validate
        run: python -m scripts.validate

      # Also copies the corpus and the schema into site/, so the published
      # page and a local build are the same thing.
      - name: Build the list
        run: python -m scripts.build_site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
