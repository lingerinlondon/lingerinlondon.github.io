# Generated by scripts/build_forms.py from schema/place.schema.json. Do not edit by hand.
name: Suggest a place
description: Suggest somewhere you can turn up to, stay a while, and pay nothing.
title: 'Suggestion: '
labels: [suggestion]
body:
  - type: markdown
    attributes:
      value: |
        This is a list of central London places you can turn up to, stay a while, and pay nothing. Suggestions are read by a person before anything is published, so there is no rush and nothing goes live automatically.

        Please suggest places you have been to yourself. One sentence on why is
        worth more than a full description.
  - type: checkboxes
    id: gates
    attributes:
      label: The four things a place has to be
      description: >-
        All four have to be true. If one of them is not, this is not the right list
        for the place — which is a fact about the list, not about the place.
    options:
      - label: "There is nothing you have to pay to get in."
        required: true
      - label: "You can sit down without buying anything."
        required: true
      - label: "You could stay for hours without anyone minding."
        required: true
      - label: "There is somewhere to sit down."
        required: true
  - type: input
    id: name
    attributes:
      label: What is it called?
    validations:
      required: true
  - type: input
    id: spot
    attributes:
      label: Which part of it, if the whole place is not the point?
      description: >-
        Optional. Somewhere like 'top floor, by the window' or 'the benches under
        the canopy'. Leave empty for the place as a whole.
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: >-
        A street and area is plenty. If you happen to know its OpenStreetMap link
        or id, paste that instead and it saves a lookup — but it is not expected.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it here?
      description: >-
        One sentence, up to 200 characters. What does this place not ask of you?
    validations:
      required: true
  - type: dropdown
    id: conversation
    attributes:
      label: Conversation
      options:
        - "discouraged — a silent room"
        - "possible — you can talk without being out of place"
        - "expected — not talking would be conspicuous"
  - type: dropdown
    id: activity
    attributes:
      label: Doing your own thing
      options:
        - "discouraged — you are expected to be here for the stated purpose"
        - "possible — nobody minds what you are doing"
        - "expected — the place is set up for it"
  - type: dropdown
    id: seating
    attributes:
      label: Seating
      options:
        - "fixed — benches or bolted seating"
        - "movable — chairs you can move"
        - "soft — sofas or armchairs"
  - type: dropdown
    id: setting
    attributes:
      label: Setting
      options:
        - "indoor — inside a building"
        - "outdoor — open air"
        - "covered — outdoors but under cover"
  - type: checkboxes
    id: support_options
    attributes:
      label: Ways to support the place, if there are any
      description: >-
        Listed on the site and never ranked or ordered by. A place with none of
        these is not worse than a place with four.
    options:
      - label: "cafe"
      - label: "shop"
      - label: "donation"
      - label: "membership"
      - label: "ticketed events"
      - label: "volunteering"
  - type: input
    id: suggested_by
    attributes:
      label: How would you like to be credited?
      description: Optional. Leave empty for no credit.
