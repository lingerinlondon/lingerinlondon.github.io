# Generated by scripts/build_forms.py from schema/place.schema.json. Do not edit by hand.
name: Suggest a place
description: Suggest somewhere you can turn up to, stay a while, and pay nothing.
title: 'Suggestion: '
labels: [suggestion]
body:
  - type: markdown
    attributes:
      value: |
        Any new suggestions are very welcome and are what keeps this site alive! For a few reasons, suggestions are confirmed by the site admin before they appear on the site.

        Please suggest places you have been to yourself. The questions below assume you have sat there — they are not answerable from a map.
  - type: checkboxes
    id: gates
    attributes:
      label: The four things a place has to be
      description: >-
        All four have to be true. If one of them is not, this is not the right list for the place — which is a fact about the list, not about the place.
      options:
        - label: "There is nothing you have to pay to get in."
          required: true
        - label: "You can sit down without buying anything."
          required: true
        - label: "You could stay for hours without anyone minding."
          required: true
        - label: "There is somewhere to sit down."
          required: true
  - type: input
    id: name
    attributes:
      label: "What is it called?"
    validations:
      required: true
  - type: input
    id: spot
    attributes:
      label: "Which part of it, if the whole place is not the point?"
      description: >-
        Optional. Somewhere like “top floor, by the window” or “the benches under the canopy”. Leave empty for the place as a whole.
  - type: input
    id: where
    attributes:
      label: "Where is it?"
      description: >-
        A street and area is plenty.
    validations:
      required: true
  - type: input
    id: osm_id
    attributes:
      label: "Its OpenStreetMap id, if you know it"
      description: >-
        Optional. Find the place on openstreetmap.org, click it, and the address bar shows something like /way/123456. Paste that, or the whole link. Leave it empty and it will be looked up for you.
  - type: input
    id: coordinates
    attributes:
      label: "Its coordinates, if you know them"
      description: >-
        Optional. Two numbers, latitude first: 51.5194, -0.1270. On openstreetmap.org, right-click the spot and choose “show address”.
  - type: input
    id: last_checked
    attributes:
      label: "When were you last there?"
      description: >-
        Places change, so a suggestion needs a date. Within the last year, please — anything older is a memory rather than a report. Written as a date, like 2025-08-31.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why is it here?"
      description: >-
        One sentence, up to 200 characters. Why does this place feel like a comfortable place to just ‘be’ in London?
    validations:
      required: true
  - type: dropdown
    id: conversation
    attributes:
      label: "Conversation"
      options:
        - "a quiet room — people keep their voices down, or do not speak at all. Come here to not be talked to."
        - "talking is fine — you can hold a conversation without being out of place, whether or not anyone actually is"
  - type: dropdown
    id: seating
    attributes:
      label: "Seating"
      options:
        - "benches — hard seating, often backless or bolted in place"
        - "upright chairs — ordinary chairs at desks or tables — comfortable enough for a couple of hours"
        - "soft seating — sofas and armchairs"
  - type: dropdown
    id: table
    attributes:
      label: "Tables"
      options:
        - "no tables — nothing to put anything on but your lap"
        - "low tables only — coffee-table height: fine for a cup or a book, awkward for a laptop"
        - "a few tables you can work at — tables at a height you can work at, but not many of them"
        - "plenty of tables you can work at — most seats come with a table you can work at"
  - type: dropdown
    id: setting
    attributes:
      label: "Setting"
      options:
        - "indoor — inside a building"
        - "outdoor — open air, so weather decides whether it works"
        - "covered — outdoors but under cover — an arcade, a colonnade, a canopy"
  - type: checkboxes
    id: support_options
    attributes:
      label: "Ways to support the place, if there are any"
      description: >-
        Only tick these if they are genuinely optional — somewhere you could sit all afternoon and buy nothing. If you have to spend money to stay, the place does not belong on this list at all. Listed on the site and never ranked or ordered by; a place with none of these is not worse than a place with four.
      options:
        - label: "cafe or bar"
        - label: "shop"
        - label: "donation"
        - label: "membership"
        - label: "ticketed events"
        - label: "volunteering"
  - type: input
    id: suggested_by
    attributes:
      label: "How would you like to be credited?"
      description: >-
        Optional. Leave empty for no credit.
